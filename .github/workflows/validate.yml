name: Validar aplicación web
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar entorno de pruebas DOM
        run: npm install --no-save --no-audit --no-fund jsdom@26.1.0
      - name: Probar altas y cambios de nombre en ambas pantallas
        run: node tests/browser.mjs
      - name: Comprobar sintaxis JavaScript
        run: node --check app.js
      - name: Verificar requisitos de interfaz
        run: node tests/requirements.mjs
      - name: Comprobar contenido web
        run: |
          test -s index.html
          test -s styles.css
          grep -q "textPath" app.js
          grep -q "questionsPanel" index.html
